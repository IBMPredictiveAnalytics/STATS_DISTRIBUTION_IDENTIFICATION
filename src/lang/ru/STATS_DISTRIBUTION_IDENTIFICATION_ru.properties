Summary=Identify the distribution of the data, with quality-control tools and ready-to-run Process Capability syntax
Description=Fits up to 17 distributions by maximum likelihood and reports goodness of fit (Anderson-Darling, likelihood-ratio tests, AIC, Akaike weights, BIC), parameter estimates, percentiles, capability by distribution, normalizing transformations, data checks and a recommendation with STATS PROCESS CAPABILITY syntax. Quality-control tools: physical bounds, tolerance intervals, recommendation stability (bootstrap), outlier sensitivity, distribution-based control limits, k-sample pooling test, and saved probabilities and normal scores. Honours Split File and weights.
